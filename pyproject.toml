[project]
name = "tandemn-orca"
version = "0.1.0"
description = "Tandemn Orca: the executor — applies Koi plans, launches chains, records outcomes."
authors = [
    { name = "Tandemn Labs" },
]
requires-python = ">=3.12"
readme = "README.md"
license = { text = "Apache-2.0" }

dependencies = [
    "tandemn-store",
    "pydantic>=2.7",
    "kubernetes>=30",
    # AWS capacity-reservation -> ResourceMap script.
    "boto3>=1.34",
]

[project.scripts]
tandemn-orca = "tandemn_orca.orca:main"

[project.optional-dependencies]
dev = [
    "pre-commit",
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.11",
]

[tool.uv.sources]
# Live, editable dependency on the canonical data layer.
tandemn-store = { path = "../tandemn-store", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tandemn_orca"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # import sorting
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # simplify
    "C4",  # comprehensions
    "RUF", # Ruff-specific rules
    "N",   # pep8-naming
    "W",   # pycodestyle warnings
]
ignore = [
    "E501", # line length handled by formatter
]

[tool.mypy]
python_version = "3.12"
files = ["src"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
show_error_codes = true

[[tool.mypy.overrides]]
# tandemn-store and boto3/botocore ship no py.typed marker.
module = ["tandemn_system_data.*", "boto3.*", "botocore.*", "kubernetes.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
